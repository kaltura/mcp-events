name: Functional Tests

on:
  workflow_dispatch:
    inputs:
      impersonated_partner_id:
        description: "Select Impersonated Partner ID"
        required: true
        default: "125612"
        type: choice
        options:
          - "125612"

jobs:
  functional-tests:
    runs-on: codebuild-ovp-frontend-runner-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Generate KALTURA_KS
        run: |
          KALTURA_KS=$(curl -s '${{ secrets.ADMIN_API_NVQ2 }}' \
            -F "service=session" \
            -F "action=impersonate" \
            -F "secret=${{ secrets.ADMIN_SECRET_NVQ }}" \
            -F "impersonatedPartnerId=${{ inputs.impersonated_partner_id }}" \
            -F "type=2" \
            -F "partnerId=-11" \
            -F "expiry=3600" \
            -F "privileges=disableentitlement" \
            -F userId=daniel.haimov@kaltura.com \
            | grep -oP '(?<=<result>)[^<]+')
          echo "::add-mask::$KALTURA_KS"
          echo "KALTURA_KS=$KALTURA_KS" >> "$GITHUB_ENV"
          echo "KALTURA_PUBLIC_API=https://events-api.nvq2.ovp.kaltura.com/api/v1" >> "$GITHUB_ENV"

      - name: Install dependencies and build MCP server
        run: npm ci && npm run build

      - name: Start MCP Events server
        run: |
          node dist/mcp-server/src/http.js &
          echo $! > /tmp/mcp-server.pid
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/health -o /dev/null; then
              echo "MCP server ready"
              break
            fi
            sleep 1
          done

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Tests code analysis
        run: npm run typecheck:functional && npm run lint

      - name: Create tests/.env
        run: |
          cat > tests/.env <<EOF
          KALTURA_KS=$KALTURA_KS
          KALTURA_PUBLIC_API=$KALTURA_PUBLIC_API
          ANTHROPIC_AUTH_TOKEN=${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL=http://litellm.central.ovp.kaltura.prod:4000
          ANTHROPIC_MODEL=claude-4-5-haiku
          MCP_SERVER_URL=http://localhost:3000/mcp
          EXECUTE_TOOLS=1
          EOF

      - name: Run functional tests
        run: npm run test:functional

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs 2>/dev/null || true
